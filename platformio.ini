[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.4.1

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_pngdec.py
  pre:scripts/patch_ld_sleep_clock.py
  pre:scripts/patch_gthr_static_mutex.py
  pre:scripts/patch_phy_rfcal_none.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-onepage-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-onepage-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-onepage-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-onepage-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds

; OnePage ESP32-C61 port. Inherits base's pioarduino platform (crosspoint's
; blessed build) and uses the custom onepage-c61 board (16MB flash, 2MB PSRAM).
[env:onepage]
extends = base
board = onepage-c61
; Bluetooth is off (CONFIG_BT_ENABLED=n in custom_sdkconfig below). Exclude the
; two BLE translation units: they include NimBLE headers and would fail to link
; once the BT archives are gone. Their call sites are additionally guarded by
; #if defined(ONEPAGE_C61) && defined(CONFIG_BT_ENABLED).
build_src_filter = +<*> -<bluetooth/> -<activities/settings/BlePageTurnerActivity.cpp>
; C61HR2 eco3 PSRAM only inits reliably at <=40MHz (arduino-esp32 ships 80MHz).
; Keep PSRAM on (C61 has only 320KB SRAM, crosspoint needs the 2MB) but at 40MHz.
; CONFIG_SPIRAM is the master switch — without it the SPEED/MALLOC keys are dead
; and PSRAM stays OFF (heap is then only ~126KB, large EPUB chapters OOM -> abort).
; Triggers a full arduino rebuild (pioarduino custom_sdkconfig).
custom_sdkconfig =
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_QUAD=y
  CONFIG_SPIRAM_SPEED_40M=y
  CONFIG_SPIRAM_USE_MALLOC=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=65536
; P2 — attempted mitigation for TLS OOM (docs/voice-openclaw-port-plan.md §4/§2.4).
; Background: with WiFi up the internal heap keeps only 4852 B as its largest
; block, and mbedtls_ssl_setup needs two ~16.5 KB in/out buffers, so
; esp_http_client_open() failed with ESP_ERR_HTTP_CONNECT
; (mbedtls_ssl_setup -0x7F00 = MBEDTLS_ERR_SSL_ALLOC_FAILED).
;
; INERT FOR THIS TOOLCHAIN — kept because pioarduino builds from source only
; what its archives do not supply, and firmware.map resolves the symbols to the
; prebuilt archives regardless:
;   * MBEDTLS_EXTERNAL_MEM_ALLOC -> esp_mbedtls_mem_calloc comes from
;     libmbedcrypto.a(esp_mem.c.obj), built with the default INTERNAL policy;
;     the esp_mem.c this build compiles never reaches the link line.
;   * SPIRAM_TRY_ALLOCATE_WIFI_LWIP -> liblwip.a / libesp_wifi.a /
;     libnet80211.a are all prebuilt (verified in firmware.map).
;   * MBEDTLS_DYNAMIC_BUFFER is dropped by kconfig anyway: it depends on
;     !MBEDTLS_SSL_PROTO_DTLS and CONFIG_MBEDTLS_SSL_PROTO_DTLS=y.
; The working fix is the runtime allocator override in
; lib/voice/SttClient.cpp (mbedtls_platform_set_calloc_free), which no archive
; in the link overwrites. If a future pioarduino builds these from source the
; flags become effective and can be reconsidered.
; NOT copied from AIWatch: no SPIRAM_FETCH_INSTRUCTIONS / SPIRAM_RODATA — PSRAM
; here is 40 MHz and instruction fetch from it would slow the CPU (§2.5).
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
; Bluetooth is removed: the BLE page-turner is out of scope. CONFIG_BT_ENABLED=n
; is the master switch — it unlinks libbt / libble_app / libbtbb / libcoexist
; (~391 KB flash + ~1.8 KB static RAM, measured from firmware.map before the
; removal) and leaves CONFIG_BT_ENABLED undefined in sdkconfig.h, which compiles
; out every src/ BLE call site. The two BLE translation units are excluded in
; build_src_filter below (they include NimBLE headers and would no longer link).
; The board's external 32.768 kHz RTC crystal setting is kept: it is independent
; of BT and improves deep-sleep RTC timekeeping.
  CONFIG_BT_ENABLED=n
  CONFIG_RTC_CLK_SRC_INT_RC=n
  CONFIG_RTC_CLK_SRC_EXT_CRYS=y
; NOTE: B2 (system auto light-sleep: CONFIG_PM_ENABLE + FREERTOS_USE_TICKLESS_IDLE
; + ESP_PHY_MAC_BB_PD) is currently UNBUILDABLE on this C61 arduino-libs build.
; Enabling it links in the PM/tickless/MAC-BB-PD code path (sleep_modem, pm_impl,
; freertos tickless, phy MAC_BB_PD) whose .text.* sections have NO placement rule
; in ld/sections.ld (arduino-esp32 ships PM off, so this path was never validated).
; Result: 13 orphan sections across 4 libs -> esptool fatal "Segment ... lands in
; same 64 KB flash mapping ... Can't generate binary". Unlike the single
; sleep_clock section (patch_ld_sleep_clock.py), this is a divergent multi-lib
; orphan/layout failure, not a one-line LD patch. Revisit when arduino-esp32 for
; C61 ships validated PM/light-sleep linker placement.
; SPI flash read clock 40->80MHz: faster boot + code-from-flash execution at
; runtime (does NOT speed up flashing). W25Q128JW / PY25Q128HA both rate >=104MHz
; so 80MHz DIO is well within spec. Revert to 40M if the board shows instability.
  CONFIG_ESPTOOLPY_FLASHFREQ_40M=n
  CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
; Startup RF calibration crashes on this C61 (eco4 ROM): when the stored cal
; data cannot be loaded from NVS, the prebuilt esp_phy escalates to FULL cal
; and the phy IQ-estimation stage dies ~5s into WiFi bring-up (MEPC
; phy_iq_est_enable_new, MTVAL phy_dc_iq_est_new, under register_chipv7_phy ->
; phy_rf_init; reproduced 2026-09-30 10:46/10:47/10:54 ELF 6764665cc and 16:23
; ELF a4852d13c). Same failure class as espressif/esp-idf#15424 (C61 full-cal
; crash); a crashing FULL cal can never store fresh data, so the device
; WiFi-crash-loops until the failure path stops escalating.
; NOTE: this Kconfig flag does NOT reach esp_phy — arduino ships it as a
; prebuilt archive (framework-arduinoespressif32-libs .../lib/libesp_phy.a), so
; phy_init.c is never compiled from source here. It is kept because the baked
; default on the success path is already PHY_RF_CAL_NONE and the flag documents
; intent for source-built configurations. The real guarantee is
; scripts/patch_phy_rfcal_none.py (pre:), which patches the archive member so
; an NVS load failure stays at NONE instead of escalating to FULL. TX power
; stays capped by CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=20; WiFi/NVS AP config
; unaffected.
  CONFIG_ESP_PHY_RF_CAL_NONE=y
; Strip arduino-esp32's default heavy managed components (not needed for a reader).
; This also removes the esp_https_server cert-embed step that trips PlatformIO's
; ".pio/build/.../https_server.crt.S not found" path-doubling bug.
custom_component_remove =
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp-modbus
  espressif/esp-serial-flasher
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/cbor
build_flags =
  ${base.build_flags}
  -DONEPAGE_C61=1
  -DCROSSPOINT_VERSION=\"onepage-dev\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2



[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG
