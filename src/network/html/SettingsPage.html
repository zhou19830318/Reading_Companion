<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - CrossPoint Reader</title>
  <style>
    /* ── page-specific bits; the AIWatch design system is in the core block ── */
    .opds-server {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin: 12px 0;
      background: var(--card-2);
    }
    .opds-server > .form-group:last-of-type { margin-bottom: 0; }
    .test-result {
      display: none;
      padding: 10px 12px;
      margin-top: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    /* The gateway pairing command: the one string the user must copy verbatim,
       so it gets a box of its own instead of a line inside the log block. */
    .approve-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(88, 166, 255, .06), transparent);
    }
    .approve-box code {
      display: block;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      word-break: break-all;
      color: var(--text);
    }
    .approve-label {
      font-size: 13px;
      color: var(--dim);
      line-height: 1.6;
    }
    .hint {
      margin: 12px 0 0;
      color: var(--dim);
      font-size: 12.5px;
      line-height: 1.6;
    }
    /* Configuration help lines live inside their own panels as .hint blocks */
    .family-meta { color: var(--label-color); font-size: 0.9em; }
    .save-container { display: flex; justify-content: center; align-items: center; gap: 10px;
      flex-wrap: wrap; margin: 18px 0; }
    /* Second-level nav: one chip per settings category, so the page never
       becomes one 3000px scroll. Same design language as the top tabs. */
    .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    .subtab { padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--card-2); color: var(--dim); font-size: 13px; font-weight: 550;
      cursor: pointer; white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s; }
    .subtab:hover { color: var(--text); background: var(--card-hi); border-color: #39414d }
    .subtab.active { color: var(--blue); border-color: var(--blue);
      background: rgba(88, 166, 255, .10) }
  
/* AIWATCH-CORE:START -- edit scripts/sync_web_core.py, not this block */
:root{
  --bg:#0a0e14;--card:#13181f;--border:#262d38;--text:#e6edf3;--dim:#8b949e;
  --green:#3fb950;--red:#f85149;--orange:#d29922;--blue:#58a6ff;--purple:#bc8cff;
  --card-2:#171d26;--card-hi:#1c2330;--accent-glow:rgba(88,166,255,.18);
  --ring:rgba(255,255,255,.06);--shadow:0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.35);
  --radius:14px;--radius-sm:10px;
  --font-color:var(--text);--title-color:var(--text);--card-bg:var(--card);
  --label-color:var(--dim);--border-color:var(--border);
  --accent-color:var(--green);--accent-hover-color:#34a84a;--toggle-bg:var(--border);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1100px 600px at 100% -10%,rgba(88,166,255,.07),transparent 60%),
    radial-gradient(900px 500px at -10% 0%,rgba(188,140,255,.06),transparent 55%),
    var(--bg);
  background-attachment:fixed;color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;line-height:1.5;margin:0;padding:0;
}
/* Header — non-sticky, exactly like AIWatch, so the tab row never overlaps */
.header{
  position:relative;background:linear-gradient(180deg,rgba(28,35,48,.85),rgba(19,24,31,.9));
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  padding:14px 22px;display:flex;align-items:center;gap:12px;
}
.header h1{font-size:18px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:0 1 auto;max-width:60%;color:var(--text);border:0;padding:0;margin:0}
.header h1 span{color:var(--green);font-weight:500;font-size:12px;margin-left:10px;opacity:.9}
.header .hdr-status{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1 1 auto;text-align:right}
.header .btn{flex:0 0 auto}
/* Tabs — one per page, links instead of AIWatch's SPA panel switcher */
.tabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--border);
  overflow-x:auto;padding:0 8px;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:5px}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tab{padding:11px 16px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;
  font-size:13.5px;font-weight:500;white-space:nowrap;text-decoration:none;
  transition:color .18s,background .18s,border-color .18s;border-radius:8px 8px 0 0}
.tab:hover{color:var(--text);background:rgba(255,255,255,.025)}
.tab.active{color:var(--text);border-bottom-color:var(--blue);
  background:linear-gradient(180deg,transparent,rgba(88,166,255,.07))}
.content{max-width:860px;margin:0 auto;padding:18px 16px 48px}
.card{
  background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;margin:0 0 14px;box-shadow:var(--shadow);
}
.card h2,.card h3{font-size:15px;font-weight:650;margin:0 0 14px;color:var(--text);
  display:flex;align-items:center;gap:9px}
/* Stat grid (AIWatch dashboard) */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{text-align:center;padding:10px 6px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.025);border:1px solid var(--ring)}
.stat .val{font-size:20px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.2}
.stat .lbl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;
  margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Forms — label above the control, full width */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;letter-spacing:.2px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;
  transition:border-color .15s,box-shadow .15s}
.form-group input:focus,.form-group select:focus{border-color:var(--blue);
  box-shadow:0 0 0 3px var(--accent-glow)}
.form-group input::placeholder{color:#5c6672}
/* Range sliders — AIWatch index.html:78-80 (6px track, glowing 16px blue thumb) */
.form-group input[type=range]{-webkit-appearance:none;appearance:none;padding:0;height:6px;
  border-radius:6px;background:var(--border);border:none}
.form-group input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid #0a0e14;
  box-shadow:0 0 8px rgba(88,166,255,.6)}
.form-group input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
  background:var(--blue);cursor:pointer;border:2px solid #0a0e14}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1}
.range-val{display:inline-block;width:40px;text-align:right;color:var(--blue);font-weight:700}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}.header h1{max-width:48%}}
/* Buttons */
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;
  font-size:13px;font-weight:550;background:var(--card-2);color:var(--text);
  transition:transform .12s,box-shadow .15s,background .15s,border-color .15s}
.btn:hover{background:var(--card-hi);border-color:#39414d}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,#46c75e,#34a84a);color:#04140a;border-color:transparent;
  box-shadow:0 4px 14px rgba(63,185,80,.28)}
.btn-primary:hover{background:linear-gradient(180deg,#52d368,#3bb454);
  box-shadow:0 6px 18px rgba(63,185,80,.38);border-color:transparent}
.btn-danger{background:linear-gradient(180deg,#fa5d54,#e4423a);color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(248,81,73,.26)}
.btn-danger:hover{background:linear-gradient(180deg,#fc6c63,#e84b43);
  box-shadow:0 6px 18px rgba(248,81,73,.36);border-color:transparent}
.btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--card-hi);border-color:#39414d}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* This project's own button class names, restyled onto the AIWatch system */
.save-btn,.btn-small,.btn-add,.btn-save-server,.action-btn{padding:8px 16px;
  border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;
  font-weight:550;background:var(--card-2);color:var(--text);
  transition:transform .12s,box-shadow .15s,background .15s,border-color .15s}
.save-btn:hover,.btn-small:hover,.btn-add:hover,.btn-save-server:hover,.action-btn:hover{
  background:var(--card-hi);border-color:#39414d}
.save-btn:active,.btn-small:active,.btn-add:active,.btn-save-server:active,.action-btn:active{
  transform:translateY(1px)}
.save-btn:disabled,.btn-small:disabled,.btn-add:disabled,.btn-save-server:disabled,
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.save-btn,.btn-save-server,.btn-add,.upload-action-btn{
  background:linear-gradient(180deg,#46c75e,#34a84a);color:#04140a;border-color:transparent;
  box-shadow:0 4px 14px rgba(63,185,80,.28)}
.save-btn:hover,.btn-save-server:hover,.btn-add:hover,.upload-action-btn:hover{
  background:linear-gradient(180deg,#52d368,#3bb454);box-shadow:0 6px 18px rgba(63,185,80,.38);
  border-color:transparent}
.btn-delete,.delete-action-btn{background:linear-gradient(180deg,#fa5d54,#e4423a);color:#fff;
  border-color:transparent;box-shadow:0 4px 14px rgba(248,81,73,.26)}
.btn-delete:hover,.delete-action-btn:hover{background:linear-gradient(180deg,#fc6c63,#e84b43);
  box-shadow:0 6px 18px rgba(248,81,73,.36);border-color:transparent}
.save-btn{padding:12px 32px;font-size:14px;font-weight:650}
/* Toggles — AIWatch 44x24 pill on both class spellings */
.toggle,.toggle-switch{position:relative;width:44px;height:24px;display:inline-block;flex-shrink:0;
  vertical-align:middle}
.toggle input,.toggle-switch input{opacity:0;width:0;height:0}
.toggle .slider,.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:24px;
  cursor:pointer;transition:background .25s}
.toggle .slider:before,.toggle-slider:before{content:"";position:absolute;height:18px;width:18px;
  left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .25s;
  box-shadow:0 1px 3px rgba(0,0,0,.4)}
.toggle input:checked+.slider,.toggle-switch input:checked+.toggle-slider{
  background:linear-gradient(180deg,#46c75e,#34a84a)}
.toggle input:checked+.slider:before,.toggle-switch input:checked+.toggle-slider:before{
  transform:translateX(20px)}
/* Toast (AIWatch bottom-right) */
.toast{position:fixed;bottom:22px;right:22px;padding:11px 18px;border-radius:10px;font-size:13.5px;
  font-weight:500;z-index:999;opacity:0;transform:translateY(6px);
  transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.45);
  max-width:min(420px,calc(100vw - 44px))}
.toast.show{opacity:1;transform:none}
.toast.ok{background:linear-gradient(180deg,#46c75e,#34a84a);color:#04140a}
.toast.err{background:linear-gradient(180deg,#fa5d54,#e4423a);color:#fff}
/* Spinner (shared base so every page gets the same 48px ring) */
.loader{width:48px;height:48px;border:5px solid var(--border);border-bottom-color:var(--blue);
  border-radius:50%;display:inline-block;box-sizing:border-box;animation:rotation 1s linear infinite}
@keyframes rotation{from{transform:rotate(0)}to{transform:rotate(360deg)}}
/* Inline feedback banners (pages that are not on the toast API yet) */
.status-ok,.message.success{background:rgba(63,185,80,.12);color:var(--green);
  border:1px solid rgba(63,185,80,.35)}
.status-err,.message.error{background:rgba(248,81,73,.12);color:var(--red);
  border:1px solid rgba(248,81,73,.35)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#39414d}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* AIWATCH-CORE:END */
</style>
</head>
<body>
  <div class="header">
    <h1 data-en="📚 CrossPoint Reader" data-cn="📚 CrossPoint 阅读器"
        data-en-title="Settings - CrossPoint Reader" data-cn-title="设置 - CrossPoint Reader">📚 CrossPoint Reader</h1>
    <span class="hdr-status"></span>
  </div>

  <div class="tabs">
    <a class="tab" href="/" data-en="Home" data-cn="首页">Home</a>
    <a class="tab" href="/files" data-en="File Manager" data-cn="文件管理">File Manager</a>
    <a class="tab active" href="/settings" data-en="Settings" data-cn="设置">Settings</a>
    <a class="tab" href="/fonts" data-en="Fonts" data-cn="字体">Fonts</a>
  </div>

  <div class="content">
    <div class="subtabs" id="subtabs" style="display:none"></div>

    <div id="settings-container">
      <div class="loader-container" style="display:flex;justify-content:center;margin:20px 0;">
        <span class="loader"></span>
      </div>
    </div>

    <!-- Action bar: Save applies to the settings categories (button shown per
         sub-tab); Reset/Reboot are device-wide and always available. -->
    <div class="save-container" id="save-container">
      <button class="save-btn" id="saveBtn" onclick="saveSettings()" disabled style="display:none"
              data-en="Save Settings" data-cn="保存设置">Save Settings</button>
      <button class="btn btn-danger" id="resetBtn" onclick="resetSettings()"
              data-en="Reset Defaults" data-cn="恢复出厂设置">Reset Defaults</button>
      <button class="btn btn-secondary" id="rebootBtn" onclick="rebootDevice()"
              data-en="Reboot Device" data-cn="重启设备">Reboot Device</button>
    </div>

    <div id="wifi-container" style="display:none"></div>
    <div id="cloud-container" style="display:none"></div>
    <div id="opds-container" style="display:none"></div>

    <div class="card">
      <p class="hint" data-en="Security — this page is served over plain http://device-ip/ and anyone on the same Wi-Fi can open it, so use it only on a trusted network. Secrets live in the device NVS: never in SD-card logs, never baked into a firmware build."
           data-cn="安全提示 — 本页面通过 http://设备IP/ 提供，同一 Wi-Fi 内的任何人都能打开，只在可信网络中使用。密钥保存在设备 NVS，不会写进 SD 卡日志，也不会打进固件包。">Security — this page is served over plain http://device-ip/ and anyone on the same Wi-Fi can open it, so use it only on a trusted network.</p>
      <p class="family-meta" style="text-align: center; margin: 12px 0 0;"
         data-en="CrossPoint E-Reader • Open Source" data-cn="CrossPoint 电子书阅读器 • 开源">
        CrossPoint E-Reader • Open Source
      </p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* AIWATCH-CORE:START -- edit scripts/sync_web_core.py, not this block */
let lang = 'en';
try {
  const saved = localStorage.getItem('cp-lang');
  if (saved === 'cn' || saved === 'en') lang = saved;
  else if ((navigator.language || '').toLowerCase().indexOf('zh') === 0) lang = 'cn';
} catch (e) { /* private mode: keep the default */ }

// Server language code for endpoints that produce localized strings.
function apiLang() { return lang === 'cn' ? 'zh-Hans' : 'en'; }

// Page string table: window.CP_STRINGS = { key: { en: '…', cn: '…' } }
function tr(key) {
  const s = (window.CP_STRINGS || {})[key];
  if (!s) return key;
  return lang === 'cn' ? s.cn : s.en;
}
// Attribute pair for JS-built markup, so the next updateLang() can rewrite it
// in place without re-rendering (and dropping typed input).
function trAttr(key) {
  const s = (window.CP_STRINGS || {})[key];
  if (!s) return '';
  return ' data-en="' + s.en + '" data-cn="' + s.cn + '"';
}

// Bottom-right feedback, same behaviour as AIWatch's toast(msg, ok).
let toastTimer = 0;
function toast(msg, ok) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.className = 'toast'; }, 3000);
}

function updateLang(skipPage) {
  document.querySelectorAll('[data-en]').forEach(function(el) {
    el.textContent = el.getAttribute('data-' + lang);
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el) {
    el.placeholder = el.getAttribute('data-' + lang + '-ph') || el.placeholder;
  });
  document.documentElement.lang = lang === 'cn' ? 'zh-Hans' : 'en';
  const title = document.querySelector('.header h1');
  if (title) document.title = (lang === 'cn' ? title.dataset.cnTitle : title.dataset.enTitle) || document.title;
  if (!skipPage && typeof onLangChange === 'function') onLangChange();
}

// The switcher itself, appended to the header like AIWatch does (index.html:552).
const cpHeader = document.querySelector('.header');
if (cpHeader) {
  const langBtn = document.createElement('button');
  langBtn.className = 'btn btn-secondary';
  langBtn.style.padding = '4px 8px';
  langBtn.style.fontSize = '11px';
  langBtn.textContent = '中文 / EN';
  langBtn.onclick = function() {
    lang = lang === 'en' ? 'cn' : 'en';
    try { localStorage.setItem('cp-lang', lang); } catch (e) { /* ignore */ }
    updateLang();
  };
  cpHeader.appendChild(langBtn);
}
// Header status line: language-neutral (model, IP, free heap) so it needs no
// translation — AIWatch uses the same slot for its connection state.
fetch('/api/status').then(function(r) { return r.json(); }).then(function(d) {
  const el = document.querySelector('.hdr-status');
  if (!el || !d) return;
  const kb = d.freeHeap ? Math.round(d.freeHeap / 1024) : 0;
  el.textContent = (d.device || '') + (d.ip ? ' · ' + d.ip : '') + (kb ? ' · ' + kb + ' KB' : '');
}).catch(function() { /* status line is optional */ });

updateLang(true);
/* AIWATCH-CORE:END */

  // --- Static UI strings (the core block exposes tr() / trAttr()) -----------
  window.CP_STRINGS = {
    saveSettings:    { en: 'Save Settings', cn: '保存设置' },
    saving:          { en: 'Saving...', cn: '保存中…' },
    noChanges:       { en: 'No changes to save.', cn: '没有需要保存的更改。' },
    savedOk:         { en: 'Settings saved!', cn: '设置已保存！' },
    loadFailed:      { en: 'Failed to load settings', cn: '加载设置失败' },
    loadFailedDetail:{ en: 'Failed to load settings: ', cn: '加载设置失败：' },
    lastConnected:   { en: 'Last connected network', cn: '最近连接的网络' },
    wifiPass:        { en: 'Password', cn: '密码' },
    unchanged:       { en: '(unchanged)', cn: '（保持不变）' },
    save:            { en: 'Save', cn: '保存' },
    del:             { en: 'Delete', cn: '删除' },
    wifiTitle:       { en: 'Wi-Fi Networks', cn: 'Wi-Fi 网络' },
    noWifi:          { en: 'No Wi-Fi networks saved', cn: '未保存的 Wi-Fi 网络' },
    addNetwork:      { en: '+ Add Network', cn: '+ 添加网络' },
    ssidRequired:    { en: 'SSID is required.', cn: 'SSID 为必填项。' },
    wifiSaved:       { en: 'Wi-Fi network saved!', cn: 'Wi-Fi 网络已保存！' },
    wifiDelConfirm:  { en: 'Delete this Wi-Fi network?', cn: '删除这个 Wi-Fi 网络？' },
    wifiDeleted:     { en: 'Wi-Fi network deleted', cn: 'Wi-Fi 网络已删除' },
    ocTitle:         { en: 'OpenClaw Server', cn: 'OpenClaw 服务器' },
    host:            { en: 'Host / IP', cn: '主机 / IP' },
    port:            { en: 'Port', cn: '端口' },
    path:            { en: 'Path', cn: '路径' },
    proto:           { en: 'Protocol', cn: '协议' },
    tlsToggle:       { en: 'TLS (wss)', cn: 'TLS (wss)' },
    caFile:          { en: 'CA file', cn: 'CA 文件' },
    token:           { en: 'Token', cn: '令牌' },
    sttTitle:        { en: 'Speech Recognition (MiMo)', cn: '语音识别（MiMo）' },
    apiKey:          { en: 'API key', cn: 'API 密钥' },

    helpStt:         { en: 'The API key is created in the platform.xiaomimimo.com console and sent in the api-key header. A blank field keeps the stored value; a blank endpoint URL uses the built-in default. Test API key sends one minimal request: 401/403 means the key was refused, any other status means it was accepted. The key is stored in the device NVS — it never appears on the page or in a log.',

                       cn: 'OPDS 是电子书目录服务器。名称随意；URL 必须以 http:// 或 https:// 开头；账号密码只对需要登录的目录有意义，密码保存后不回显。' },
    // Action bar (Save / Reset Defaults / Reboot), AIWatch index.html style.
    resetting:       { en: 'Resetting...', cn: '正在恢复…' },
    resetConfirm:    { en: 'Restore all reader settings to factory defaults? Wi-Fi networks, OPDS servers and cloud credentials are kept.',
                       cn: '将全部阅读器设置恢复为出厂默认值？已保存的 Wi-Fi 网络、OPDS 服务器和云服务凭据会保留。' },
    resetOk:         { en: 'Settings restored to defaults.', cn: '设置已恢复出厂默认。' },

                       cn: '立即重启阅读器？设备重启期间 Web 服务会停止，几秒后刷新本页即可。' },

  };

  let allSettings = [];
  let originalValues = {};
  let preserveQuickResumeTimeoutOn = false;
  let quickResumeTimeoutAutoEnabled = false;
  const SLEEP_SCREEN_MODE = {
    QUICK_RESUME: 6
  };

  // The settings list is rendered by the server (?lang= picks the language),
  // so a language switch has to refetch it — everything else on this page is
  // rewritten in place by updateLang() through data-en / data-cn attributes.
  function onLangChange() {
    loadSettings(pendingSettingValues());
  }

  // Values currently in the form, so a language switch can put them back
  // after the list is rebuilt from the server.
  function pendingSettingValues() {
    const values = {};
    allSettings.forEach(function(s) {
      const v = getValue(s);
      if (v !== undefined) values[s.key] = v;
    });
    return values;
  }

  function escapeHtml(unsafe) {
    return unsafe
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  // One line of distributed configuration help, rendered at the bottom of
  // the panel it describes (trAttr keeps it bilingual across language flips).
  function hint(key) {
    return '<p class="hint"' + trAttr(key) + '>' + tr(key) + '</p>';
  }

  // AIWatch keeps feedback in a fixed bottom-right toast instead of a banner.
  function showMessage(text, isError) {
    toast(text, !isError);
  }

  function renderControl(setting) {
    const id = 'setting-' + setting.key;

    if (setting.type === 'toggle') {
      const checked = setting.value ? 'checked' : '';
      return '<label class="toggle-switch">' +
        '<input type="checkbox" id="' + id + '" ' + checked + ' onchange="handleSettingChanged(\'' + setting.key + '\')">' +
        '<span class="toggle-slider"></span></label>';
    }

    if (setting.type === 'enum') {
      let html = '<select id="' + id + '" onchange="handleSettingChanged(\'' + setting.key + '\')">';
      setting.options.forEach(function(opt, idx) {
        const selected = idx === setting.value ? ' selected' : '';
        html += '<option value="' + idx + '"' + selected + '>' + escapeHtml(opt) + '</option>';
      });
      html += '</select>';
      return html;
    }

    if (setting.type === 'value') {
      const attrs = ' value="' + setting.value + '" min="' + setting.min +
        '" max="' + setting.max + '" step="' + setting.step + '"';
      // AIWatch drives its numbers with a slider + live value readout; wide
      // ranges stay as number inputs, where dragging loses precision.
      const steps = (setting.max - setting.min) / (setting.step || 1);
      if (steps > 0 && steps <= 100) {
        const spanId = id + '-val';
        return '<div class="range-row">' +
          '<input type="range" id="' + id + '"' + attrs +
          ' oninput="document.getElementById(\'' + spanId + '\').textContent=this.value;' +
          'handleSettingChanged(\'' + setting.key + '\')">' +
          '<span class="range-val" id="' + spanId + '">' + setting.value + '</span></div>';
      }
      return '<input type="number" id="' + id + '"' + attrs +
        ' onchange="handleSettingChanged(\'' + setting.key + '\')">';
    }

    if (setting.type === 'string') {
      const inputType = setting.name.toLowerCase().includes('password') ? 'password' : 'text';
      const val = setting.value || '';
      return '<input type="' + inputType + '" id="' + id + '" value="' + escapeHtml(val) + '"' +
        ' oninput="handleSettingChanged(\'' + setting.key + '\')">';
    }

    return '';
  }

  // One setting = one .form-group (label above control), the layout AIWatch
  // uses on its config panel. Toggles get the label and the switch on one row.
  function renderSettingRow(s) {
    const id = 'setting-' + s.key;
    const rowId = 'row-setting-' + s.key;
    if (s.type === 'toggle') {
      return '<div class="form-group" id="' + rowId + '" data-display="flex"' +
        ' style="display:flex;align-items:center;gap:12px">' +
        '<label for="' + id + '" style="margin:0;flex:1">' + escapeHtml(s.name) + '</label>' +
        renderControl(s) + '</div>';
    }
    return '<div class="form-group" id="' + rowId + '">' +
      '<label for="' + id + '">' + escapeHtml(s.name) + '</label>' +
      renderControl(s) + '</div>';
  }

  function getValue(setting) {
    const el = document.getElementById('setting-' + setting.key);
    if (!el) return undefined;

    if (setting.type === 'toggle') {
      return el.checked ? 1 : 0;
    }
    if (setting.type === 'enum') {
      return parseInt(el.value, 10);
    }
    if (setting.type === 'value') {
      return parseInt(el.value, 10);
    }
    if (setting.type === 'string') {
      return el.value;
    }
    return undefined;
  }

  function markChanged() {
    document.getElementById('saveBtn').disabled = false;
  }

  function findSetting(key) {
    return allSettings.find(function(s) { return s.key === key; });
  }

  function getControl(key) {
    return document.getElementById('setting-' + key);
  }

  function getControlValue(key) {
    const setting = findSetting(key);
    const el = getControl(key);
    if (!setting || !el) return undefined;

    if (setting.type === 'toggle') {
      return el.checked ? 1 : 0;
    }
    if (setting.type === 'enum' || setting.type === 'value') {
      return parseInt(el.value, 10);
    }
    return el.value;
  }

  function setControlValue(key, value) {
    const setting = findSetting(key);
    const el = getControl(key);
    if (!setting || !el) return false;

    if (setting.type === 'toggle') {
      const checked = !!value;
      if (el.checked === checked) return false;
      el.checked = checked;
      return true;
    }

    const nextValue = String(value);
    if (el.value === nextValue) return false;
    el.value = nextValue;
    return true;
  }

  function isQuickResumeSleepScreenSelected() {
    const sleepScreen = findSetting('sleepScreen');
    const sleepScreenValue = getControlValue('sleepScreen');
    if (!sleepScreen || sleepScreenValue === undefined || !Number.isFinite(sleepScreenValue)) return false;

    let selectedValue = sleepScreenValue;
    if (Array.isArray(sleepScreen.values)) {
      selectedValue = Number(sleepScreen.values[sleepScreenValue]);
    } else if (Array.isArray(sleepScreen.options)) {
      const selectedOption = sleepScreen.options[sleepScreenValue];
      if (selectedOption && typeof selectedOption === 'object' && 'value' in selectedOption) {
        selectedValue = Number(selectedOption.value);
      }
    }

    return selectedValue === SLEEP_SCREEN_MODE.QUICK_RESUME;
  }

  function syncQuickResumeTimeoutForSleepScreen(sleepScreenChanged, quickResumeTimeoutChanged) {
    const timeoutValue = getControlValue('quickResumeSleepScreen');
    if (timeoutValue === undefined) return false;

    let changed = false;
    if (quickResumeTimeoutChanged) {
      preserveQuickResumeTimeoutOn = timeoutValue === 1;
      quickResumeTimeoutAutoEnabled = false;
    }

    if (isQuickResumeSleepScreenSelected()) {
      if (timeoutValue !== 1) {
        changed = setControlValue('quickResumeSleepScreen', 1);
        quickResumeTimeoutAutoEnabled = !preserveQuickResumeTimeoutOn;
      } else if (sleepScreenChanged && !preserveQuickResumeTimeoutOn) {
        quickResumeTimeoutAutoEnabled = true;
      }
      return changed;
    }

    if (sleepScreenChanged && quickResumeTimeoutAutoEnabled && !preserveQuickResumeTimeoutOn) {
      changed = setControlValue('quickResumeSleepScreen', 0);
      quickResumeTimeoutAutoEnabled = false;
    }
    return changed;
  }

  function updateSettingsVisibility() {
    const shortPwrBtnVal = getControlValue('shortPwrBtn');
    const pwrBtnFootnoteBackRow = document.getElementById('row-setting-pwrBtnFootnoteBack');
    if (pwrBtnFootnoteBackRow) {
      // data-display remembers the row's layout (flex for toggles), because
      // clearing display would otherwise drop it back to block.
      pwrBtnFootnoteBackRow.style.display =
        shortPwrBtnVal === 4 ? (pwrBtnFootnoteBackRow.dataset.display || '') : 'none';
    }
  }

  function handleSettingChanged(key) {
    syncQuickResumeTimeoutForSleepScreen(key === 'sleepScreen', key === 'quickResumeSleepScreen');
    if (key === 'shortPwrBtn') {
      updateSettingsVisibility();
    }
    markChanged();
  }

  // --- Second-level nav -----------------------------------------------------
  // Category cards come from the server (already localized), the three fixed
  // panels live in the static markup. One chip per panel; the save button
  // belongs to the settings categories only — reset/reboot stay always visible.
  const FIXED_PANELS = ['wifi-container', 'cloud-container', 'opds-container'];
  const FIXED_LABEL_KEYS = ['wifiTitle', 'cloudTab', 'opdsTitle'];
  let settingCatCount = 0;
  let activeSub = 0;

  function buildSubTabs(cats) {
    settingCatCount = cats.length;
    let html = '';
    cats.forEach(function(category, i) {
      html += '<button class="subtab" onclick="activateSubTab(' + i + ')">' +
        escapeHtml(category) + '</button>';
    });
    FIXED_LABEL_KEYS.forEach(function(key, j) {
      html += '<button class="subtab"' + trAttr(key) + ' onclick="activateSubTab(' +
        (cats.length + j) + ')">' + tr(key) + '</button>';
    });
    const bar = document.getElementById('subtabs');
    bar.innerHTML = html;
    bar.style.display = '';
    if (activeSub >= cats.length + FIXED_PANELS.length) activeSub = 0;
    activateSubTab(activeSub);
  }

  function activateSubTab(idx) {
    activeSub = idx;
    const chips = document.querySelectorAll('#subtabs .subtab');
    chips.forEach(function(t, i) { t.classList.toggle('active', i === idx); });
    document.querySelectorAll('#settings-container .card[data-cat]').forEach(function(c) {
      c.style.display = (+c.dataset.cat === idx) ? '' : 'none';
    });
    FIXED_PANELS.forEach(function(id, j) {
      const el = document.getElementById(id);
      if (el) el.style.display = (idx === settingCatCount + j) ? '' : 'none';
    });
    // The save button applies to the settings form; the action bar itself
    // (reset/reboot) is device-wide and stays visible on every panel.
    const saveBtn = document.getElementById('saveBtn');
    if (saveBtn) saveBtn.style.display = (idx < settingCatCount) ? '' : 'none';
    window.scrollTo(0, 0);
  }

  // preserve: values already typed by the user. Used by the language switch,
  // where only the labels change — the controls themselves must not reset.
  async function loadSettings(preserve) {
    try {
      const response = await fetch('/api/settings?lang=' + encodeURIComponent(apiLang()));
      if (!response.ok) {
        throw new Error(tr('loadFailedDetail') + response.status);
      }
      allSettings = await response.json();

      // Store original values
      originalValues = {};
      allSettings.forEach(function(s) {
        originalValues[s.key] = s.value;
      });

      // Group by category
      const groups = {};
      allSettings.forEach(function(s) {
        if (!groups[s.category]) groups[s.category] = [];
        groups[s.category].push(s);
      });

      const container = document.getElementById('settings-container');
      let html = '';

      const cats = Object.keys(groups);
      // The reader help line belongs to the category that holds the typography
      // settings; the server-localized name can't be matched, the key can.
      const readerCat = cats.findIndex(function(category) {
        return groups[category].some(function(s) { return s.key === 'fontSize'; });
      });
      cats.forEach(function(category, ci) {
        html += '<div class="card" data-cat="' + ci + '"><h3>' + escapeHtml(category) + '</h3>';
        groups[category].forEach(function(s) {
          html += renderSettingRow(s);
        });
        if (ci === readerCat) html += hint('helpReader');
        html += '</div>';
      });

      container.innerHTML = html;
      updateSettingsVisibility();
      buildSubTabs(cats);
      document.getElementById('saveBtn').disabled = true;
      if (preserve) {
        let restored = false;
        for (const key in preserve) {
          if (setControlValue(key, preserve[key])) restored = true;
        }
        // Unsaved edits survive the language switch and still ask to be saved.
        if (restored) markChanged();
      }
      preserveQuickResumeTimeoutOn = getControlValue('quickResumeSleepScreen') === 1;
      quickResumeTimeoutAutoEnabled = false;
      if (syncQuickResumeTimeoutForSleepScreen(true, false)) {
        markChanged();
      }
    } catch (e) {
      console.error(e);
      document.getElementById('settings-container').innerHTML =
        '<div class="card"><p style="text-align:center;color:var(--red);">' +
        escapeHtml(tr('loadFailed')) + '</p></div>';
    }
  }

  async function saveSettings() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = tr('saving');

    // Collect only changed values
    const changes = {};
    allSettings.forEach(function(s) {
      const current = getValue(s);
      if (current !== undefined && current !== originalValues[s.key]) {
        changes[s.key] = current;
      }
    });

    if (Object.keys(changes).length === 0) {
      showMessage(tr('noChanges'), false);
      btn.textContent = tr('saveSettings');
      return;
    }

    try {
      const response = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(changes)
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || 'Save failed');
      }

      // Update original values to new values
      for (const key in changes) {
        originalValues[key] = changes[key];
      }

      showMessage(tr('savedOk'), false);
    } catch (e) {
      console.error(e);
      showMessage(tr('errPrefix') + e.message, true);
    }

    btn.textContent = tr('saveSettings');
  }

  // Factory reset of settings.json fields only — Wi-Fi/OPDS/cloud stores are
  // separate and stay untouched (the confirm text says so). The page then
  // refetches the list so every control shows the restored default.
  async function resetSettings() {
    if (!confirm(tr('resetConfirm'))) return;
    const btn = document.getElementById('resetBtn');
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = tr('resetting');
    try {
      const resp = await fetch('/api/settings/reset', { method: 'POST' });
      if (!resp.ok) throw new Error(await resp.text());
      toast(tr('resetOk'), true);
      await loadSettings();
    } catch (e) {
      console.error(e);
      showMessage(tr('errPrefix') + e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  async function rebootDevice() {
    if (!confirm(tr('rebootConfirm'))) return;
    const btn = document.getElementById('rebootBtn');
    btn.disabled = true;
    btn.textContent = tr('rebooting');
    toast(tr('rebooting'), true);
    try {
      await fetch('/api/reboot', { method: 'POST' });
    } catch (e) {
      // Expected: the device goes down mid-response.
    }
  }

  loadSettings();

  // --- Wi-Fi Network Management ---
  // Renders an editable list of saved Wi-Fi networks using /api/wifi endpoints.
  // Password fields are never pre-filled; when left blank during edit, existing
  // passwords remain unchanged server-side.
  let wifiNetworks = [];

  function phAttrs(key, active) {
    if (!active) return '';
    const s = window.CP_STRINGS[key];
    const v = lang === 'cn' ? s.cn : s.en;
    return ' placeholder="' + v + '" data-en-ph="' + s.en + '" data-cn-ph="' + s.cn + '"';
  }

  function btnRow(inner) {
    return '<div class="btn-row">' + inner + '</div>';
  }

  function renderWifiNetwork(net, idx) {
    const isNew = idx === -1;
    const id = isNew ? 'new' : idx;
    const lastConnected = net.isLastConnected
      ? '<div class="hint"' + trAttr('lastConnected') + '>' + tr('lastConnected') + '</div>'
      : '';

    return '<div class="opds-server" id="wifi-' + id + '">' +
      '<div class="form-group">' +
        '<label for="wifi-ssid-' + id + '">SSID</label>' +
        '<input type="text" id="wifi-ssid-' + id + '" value="' + escapeHtml(net.ssid || '') + '">' +
      '</div>' +
      '<div class="form-group">' +
        '<label for="wifi-pass-' + id + '"' + trAttr('wifiPass') + '>' + tr('wifiPass') + '</label>' +
        '<input type="password" id="wifi-pass-' + id + '"' + phAttrs('unchanged', net.hasPassword) + '>' +
      '</div>' +
      lastConnected +
      btnRow(
        '<button class="btn btn-primary"' + trAttr('save') + ' onclick="saveWifiNetwork(' + idx + ')">' + tr('save') + '</button>' +
        (isNew ? '' : '<button class="btn btn-danger"' + trAttr('del') + ' onclick="deleteWifiNetwork(' + idx + ')">' + tr('del') + '</button>')
      ) +
    '</div>';
  }

  function renderWifiSection() {
    const container = document.getElementById('wifi-container');
    let html = '<div class="card"><h3>📶 <span' + trAttr('wifiTitle') + '>' + tr('wifiTitle') + '</span></h3>';

    if (wifiNetworks.length === 0) {
      html += '<p class="hint" style="text-align:center"' + trAttr('noWifi') + '>' + tr('noWifi') + '</p>';
    } else {
      wifiNetworks.forEach(function(net, idx) {
        html += renderWifiNetwork(net, idx);
      });
    }

    html += btnRow('<button class="btn btn-secondary"' + trAttr('addNetwork') +
      ' onclick="addWifiNetwork()">' + tr('addNetwork') + '</button>');
    html += hint('helpWifi');
    html += '</div>';
    container.innerHTML = html;
  }

  async function loadWifiNetworks() {
    try {
      const resp = await fetch('/api/wifi');
      if (!resp.ok) throw new Error('Failed to load');
      wifiNetworks = await resp.json();
      renderWifiSection();
    } catch (e) {
      console.error('Wi-Fi load error:', e);
    }
  }

  function addWifiNetwork() {
    const container = document.getElementById('wifi-container');
    const card = container.querySelector('.card');
    const addBtn = card.querySelector('.btn-secondary').parentElement;
    // Prevent multiple unsaved new-network forms at once (idx -1 -> id "new")
    if (document.getElementById('wifi-new')) return;
    addBtn.insertAdjacentHTML('beforebegin', renderWifiNetwork({ssid:'',hasPassword:false,isLastConnected:false}, -1));
  }

  async function saveWifiNetwork(idx) {
    const id = idx === -1 ? 'new' : idx;
    const ssid = document.getElementById('wifi-ssid-' + id).value.trim();
    if (!ssid) {
      showMessage(tr('ssidRequired'), true);
      return;
    }

    const data = { ssid: ssid };
    // Only include password when the user actually typed something; omitting it
    // tells the server to preserve an existing password.
    const pass = document.getElementById('wifi-pass-' + id).value;
    if (pass) data.password = pass;
    if (idx >= 0) data.index = idx;

    try {
      const resp = await fetch('/api/wifi', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage(tr('wifiSaved'), false);
      await loadWifiNetworks();
    } catch (e) {
      showMessage(tr('errPrefix') + e.message, true);
    }
  }

  async function deleteWifiNetwork(idx) {
    if (!confirm(tr('wifiDelConfirm'))) return;
    try {
      const resp = await fetch('/api/wifi/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: idx})
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage(tr('wifiDeleted'), false);
      await loadWifiNetworks();
    } catch (e) {
      showMessage(tr('errPrefix') + e.message, true);
    }
  }

  // --- Cloud services (NVS) ---
  // OpenClaw endpoint and MiMo STT key, edited the same way as the Wi-Fi card.
  // Secrets are never pre-filled: the server reports hasToken / hasSttKey, and
  // a blank secret field is omitted from the POST so the stored value survives
  // a save that only changed the host.
  let cloudCfg = {};

  function renderCloudCards(cfg) {
    const container = document.getElementById('cloud-container');

    const oc = '<div class="card"><h3>🤖 <span' + trAttr('ocTitle') + '>' + tr('ocTitle') + '</span></h3>' +
      '<div class="form-row">' +
        '<div class="form-group"><label for="oc-host"' + trAttr('host') + '>' + tr('host') + '</label>' +
          '<input type="text" id="oc-host" value="' + escapeHtml(cfg.host || '') + '" placeholder="e.g. 118.25.20.250"></div>' +
        '<div class="form-group"><label for="oc-port"' + trAttr('port') + '>' + tr('port') + '</label>' +
          '<input type="number" id="oc-port" value="' + (cfg.port || 443) + '" min="1" max="65535" onchange="autoTlsFromPort()"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label for="oc-path"' + trAttr('path') + '>' + tr('path') + '</label>' +
          '<input type="text" id="oc-path" value="' + escapeHtml(cfg.path || '/') + '"></div>' +
        '<div class="form-group"><label for="oc-proto"' + trAttr('proto') + '>' + tr('proto') + '</label>' +
          '<input type="text" id="oc-proto" value="' + escapeHtml(cfg.protocol || 'v2.openclaw.io') + '"></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-group" style="display:flex;align-items:center;gap:12px">' +
          '<label style="margin:0;flex:1"' + trAttr('tlsToggle') + '>' + tr('tlsToggle') + '</label>' +
          '<label class="toggle-switch"><input type="checkbox" id="oc-tls"' + (cfg.tls ? ' checked' : '') +
          '><span class="toggle-slider"></span></label></div>' +
        '<div class="form-group"><label for="oc-ca"' + trAttr('caFile') + '>' + tr('caFile') + '</label>' +
          '<input type="text" id="oc-ca" value="' + escapeHtml(cfg.caPath || '') + '" placeholder="/root.pem"></div>' +
      '</div>' +
      '<div class="form-group"><label for="oc-token"' + trAttr('token') + '>' + tr('token') + '</label>' +
        '<input type="password" id="oc-token"' + phAttrs('unchanged', cfg.hasToken) + '></div>' +
      btnRow('<button class="btn btn-primary"' + trAttr('save') + ' onclick="saveOpenClaw()">' + tr('save') + '</button>') +
      hint('helpOpenClaw') +
      '</div>';

    const stt = '<div class="card"><h3>🎙️ <span' + trAttr('sttTitle') + '>' + tr('sttTitle') + '</span></h3>' +
      '<div class="form-group"><label for="stt-key"' + trAttr('apiKey') + '>' + tr('apiKey') + '</label>' +
        '<input type="password" id="stt-key"' + phAttrs('unchanged', cfg.hasSttKey) + '></div>' +
      '<div class="form-group"><label for="stt-url"' + trAttr('endpointUrl') + '>' + tr('endpointUrl') + '</label>' +
        '<input type="text" id="stt-url" value="' + escapeHtml(cfg.sttUrl || '') + '" placeholder="(built-in default)"></div>' +
      btnRow(
        '<button class="btn btn-primary"' + trAttr('save') + ' onclick="saveStt()">' + tr('save') + '</button>' +
        '<button class="btn btn-secondary" id="stt-test-btn" onclick="testSttKey()"' + trAttr('testKey') + '>' + tr('testKey') + '</button>'
      ) +
      '<div id="stt-test-result" class="test-result"></div>' +
      hint('helpStt') +
      '</div>';

    const test = '<div class="card"><h3>🔗 <span' + trAttr('testTitle') + '>' + tr('testTitle') + '</span></h3>' +
      '<div class="form-group" style="display:flex;align-items:center;gap:12px">' +
        '<label style="margin:0;flex:1"' + trAttr('endpoint') + '>' + tr('endpoint') + '</label>' +
        '<span class="hdr-status" id="oc-endpoint" style="flex:0 1 auto;text-align:right"></span></div>' +
      btnRow('<button class="btn btn-primary" id="oc-test-btn" onclick="testOpenClaw()"' +
        trAttr('testConn') + '>' + tr('testConn') + '</button>') +
      '<div id="oc-test-result" class="test-result"></div>' +
      '<div class="approve-box" id="oc-approve">' +
        '<div class="approve-label"' + trAttr('approveLabel') + '>' + tr('approveLabel') + '</div>' +
        '<code id="oc-approve-cmd">openclaw devices approve</code>' +
        '<div class="btn-row"><button class="btn btn-secondary" onclick="copyApprove()"' +
          trAttr('copyCmd') + '>' + tr('copyCmd') + '</button></div>' +
      '</div>' +
      hint('helpApprove') +
      '</div>';

    container.innerHTML = oc + stt + test;
    showEndpoint();
  }

  // The test button dials the form's current values, not the saved ones, so a
  // typo can be caught before Save.
  function showEndpoint() {
    const el = document.getElementById('oc-endpoint');
    if (!el) return;
    const scheme = document.getElementById('oc-tls').checked ? 'wss' : 'ws';
    const port = document.getElementById('oc-port').value || '443';
    const path = document.getElementById('oc-path').value || '/';
    el.textContent = scheme + '://' + (document.getElementById('oc-host').value || '(no host)') + ':' + port + path;
  }

  function testResultLines(r) {
    const head = r.ok ? 'OK  ' : 'FAIL @ ' + r.stage;
    const lines = [head + '  ' + (r.detail || '') + '  (' + r.ms + ' ms)', r.url];
    if (r.firstFrame) lines.push('first frame: ' + r.firstFrame);
    // The pairing instruction lives in its own box below (showApprove), not
    // here: this block is a monospace log, that one is meant to be copied.
    return lines.join('\n');
  }

  function showApprove(requestId) {
    const box = document.getElementById('oc-approve');
    const cmd = document.getElementById('oc-approve-cmd');
    if (!box || !cmd) return;
    cmd.textContent = 'openclaw devices approve ' + requestId;
    box.style.display = 'flex';
  }

  // navigator.clipboard needs a secure context, and the page is served over
  // plain http://<lan-ip>/ — so expect the fallback: select the text and let
  // the user copy it by hand.
  async function copyApprove() {
    const cmd = document.getElementById('oc-approve-cmd');
    if (!cmd) return;
    const text = cmd.textContent;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        showMessage(tr('copied'), false);
        return;
      }
      throw new Error('clipboard unavailable');
    } catch (e) {
      try {
        const range = document.createRange();
        range.selectNodeContents(cmd);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } catch (e2) { /* selection is best-effort */ }
      showMessage(tr('copyManual'), true);
    }
  }

  async function testOpenClaw() {
    const btn = document.getElementById('oc-test-btn');
    const out = document.getElementById('oc-test-result');
    const approve = document.getElementById('oc-approve');
    const data = {
      host: document.getElementById('oc-host').value.trim(),
      port: parseInt(document.getElementById('oc-port').value, 10) || 443,
      path: document.getElementById('oc-path').value.trim() || '/',
      protocol: document.getElementById('oc-proto').value.trim(),
      tls: document.getElementById('oc-tls').checked,
      caPath: document.getElementById('oc-ca').value.trim()
    };
    // Same rule as Save: an empty token field means "use the stored one", so
    // the Test button can try a corrected token without committing it first.
    const ocToken = document.getElementById('oc-token').value;
    if (ocToken) data.token = ocToken;
    btn.disabled = true;
    if (approve) approve.style.display = 'none';
    out.style.display = 'block';
    out.style.backgroundColor = 'rgba(88,166,255,.10)';
    out.textContent = tr('testing') + ' ' + data.host + ':' + data.port + ' ...';
    try {
      const resp = await fetch('/api/openclaw/test', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
        // The probe is bounded at ~17 s server-side; give it room plus slack.
        signal: AbortSignal.timeout(30000)
      });
      const r = await resp.json();
      out.style.backgroundColor = r.ok ? 'rgba(63,185,80,.12)' : 'rgba(248,81,73,.12)';
      out.style.color = r.ok ? 'var(--green)' : 'var(--red)';
      out.textContent = testResultLines(r);
      if (r.requestId) showApprove(r.requestId);
      if (!r.ok) {
        const hint = r.requestId ? tr('ocFailPairing') : '';
        toast('OpenClaw: ' + r.stage + hint, false);
      }
    } catch (e) {
      out.style.backgroundColor = 'rgba(248,81,73,.12)';
      out.style.color = 'var(--red)';
      out.textContent = tr('errPrefix') + e.message;
      showMessage(tr('errPrefix') + e.message, true);
    } finally {
      btn.disabled = false;
    }
  }

  // --- MiMo API key test ---------------------------------------------------
  // One minimal request to /api/stt/test. The key typed into the form (not yet
  // saved) is sent along, so a new key can be validated before committing it.
  function sttResultLines(r) {
    const lines = [];
    let head;
    if (r.ok) head = 'OK  ';
    else if (r.accepted) head = 'HTTP ' + r.httpStatus + '  ';
    else head = 'FAIL @ ' + r.stage + '  ';
    lines.push(head + (r.detail || '') + '  (' + r.ms + ' ms)');
    lines.push('status: ' + r.httpStatus + '  stage: ' + r.stage);
    return lines.join('\n');
  }

  async function testSttKey() {
    const btn = document.getElementById('stt-test-btn');
    const out = document.getElementById('stt-test-result');
    if (!btn || !out) return;

    const data = {};
    const url = document.getElementById('stt-url').value.trim();
    if (url) data.sttUrl = url;
    const key = document.getElementById('stt-key').value;
    if (key) data.sttKey = key;

    btn.disabled = true;
    out.style.display = 'block';
    out.style.backgroundColor = 'rgba(88,166,255,.10)';
    out.style.color = 'var(--text)';
    out.textContent = tr('sttTesting');
    try {
      const resp = await fetch('/api/stt/test', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
        // The probe is bounded at ~15 s server-side.
        signal: AbortSignal.timeout(30000)
      });
      const r = await resp.json();
      out.style.backgroundColor = r.accepted ? 'rgba(63,185,80,.12)' : 'rgba(248,81,73,.12)';
      out.style.color = r.accepted ? 'var(--green)' : 'var(--red)';
      out.textContent = sttResultLines(r);
      showMessage(r.accepted ? tr('sttOk') : tr('sttFail'), !r.accepted);
    } catch (e) {
      out.style.backgroundColor = 'rgba(248,81,73,.12)';
      out.style.color = 'var(--red)';
      out.textContent = tr('errPrefix') + e.message;
      showMessage(tr('errPrefix') + e.message, true);
    } finally {
      btn.disabled = false;
    }
  }

  // AIWatch picks the scheme from the port (openclaw_client.c:1388): 443 and
  // 18790 are WSS, 18789 and 80 are plaintext. Mirror it so the checkbox
  // follows the port, while still leaving the user free to override it.
  function autoTlsFromPort() {
    const p = parseInt(document.getElementById('oc-port').value, 10);
    const cb = document.getElementById('oc-tls');
    if (p === 443 || p === 18790) cb.checked = true;
    else if (p === 18789 || p === 80) cb.checked = false;
    showEndpoint();
  }

  document.addEventListener('input', function(e) {
    if (e.target && /^oc-/.test(e.target.id)) showEndpoint();
  });

  async function loadCloudConfig() {
    try {
      const resp = await fetch('/api/cloud');
      if (!resp.ok) throw new Error('Failed to load');
      cloudCfg = await resp.json();
      renderCloudCards(cloudCfg);
    } catch (e) {
      console.error('Cloud config load error:', e);
    }
  }

  async function postCloud(data, okMessage) {
    try {
      const resp = await fetch('/api/cloud', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage(okMessage, false);
      await loadCloudConfig();
    } catch (e) {
      showMessage(tr('errPrefix') + e.message, true);
    }
  }

  function saveOpenClaw() {
    const data = {
      host: document.getElementById('oc-host').value.trim(),
      port: parseInt(document.getElementById('oc-port').value, 10) || 443,
      path: document.getElementById('oc-path').value.trim() || '/',
      protocol: document.getElementById('oc-proto').value.trim(),
      tls: document.getElementById('oc-tls').checked,
      caPath: document.getElementById('oc-ca').value.trim()
    };
    const token = document.getElementById('oc-token').value;
    if (token) data.token = token;
    postCloud(data, tr('ocSaved'));
  }

  function saveStt() {
    const data = { sttUrl: document.getElementById('stt-url').value.trim() };
    const key = document.getElementById('stt-key').value;
    if (key) data.sttKey = key;
    postCloud(data, tr('sttSaved'));
  }

  // --- OPDS Server Management ---
  // Dynamically renders an editable list of OPDS servers, communicating with the
  // /api/opds REST endpoints. Password fields are never pre-filled for security;
  // the "(unchanged)" placeholder indicates an existing password is preserved on save.
  let opdsServers = [];

  function renderOpdsServer(srv, idx) {
    const isNew = idx === -1;
    const id = isNew ? 'new' : idx;
    return '<div class="opds-server" id="opds-' + id + '">' +
      '<div class="form-group"><label for="opds-name-' + id + '"' + trAttr('serverName') + '>' + tr('serverName') + '</label>' +
        '<input type="text" id="opds-name-' + id + '" value="' + escapeHtml(srv.name || '') + '"></div>' +
      '<div class="form-group"><label for="opds-url-' + id + '"' + trAttr('url') + '>' + tr('url') + '</label>' +
        '<input type="text" id="opds-url-' + id + '" value="' + escapeHtml(srv.url || '') + '"></div>' +
      '<div class="form-group"><label for="opds-user-' + id + '"' + trAttr('username') + '>' + tr('username') + '</label>' +
        '<input type="text" id="opds-user-' + id + '" value="' + escapeHtml(srv.username || '') + '"></div>' +
      '<div class="form-group"><label for="opds-pass-' + id + '"' + trAttr('wifiPass') + '>' + tr('wifiPass') + '</label>' +
        '<input type="password" id="opds-pass-' + id + '"' + phAttrs('unchanged', srv.hasPassword) + '></div>' +
      btnRow(
        '<button class="btn btn-primary"' + trAttr('save') + ' onclick="saveOpdsServer(' + idx + ')">' + tr('save') + '</button>' +
        (isNew ? '' : '<button class="btn btn-danger"' + trAttr('del') + ' onclick="deleteOpdsServer(' + idx + ')">' + tr('del') + '</button>')
      ) +
    '</div>';
  }

  function renderOpdsSection() {
    const container = document.getElementById('opds-container');
    let html = '<div class="card"><h3>📚 <span' + trAttr('opdsTitle') + '>' + tr('opdsTitle') + '</span></h3>';

    if (opdsServers.length === 0) {
      html += '<p class="hint" style="text-align:center"' + trAttr('noOpds') + '>' + tr('noOpds') + '</p>';
    } else {
      opdsServers.forEach(function(srv, idx) {
        html += renderOpdsServer(srv, idx);
      });
    }

    html += btnRow('<button class="btn btn-secondary"' + trAttr('addServer') +
      ' onclick="addOpdsServer()">' + tr('addServer') + '</button>');
    html += hint('helpOpds');
    html += '</div>';
    container.innerHTML = html;
  }

  async function loadOpdsServers() {
    try {
      const resp = await fetch('/api/opds');
      if (!resp.ok) throw new Error('Failed to load');
      opdsServers = await resp.json();
      renderOpdsSection();
    } catch (e) {
      console.error('OPDS load error:', e);
    }
  }

  function addOpdsServer() {
    const container = document.getElementById('opds-container');
    const card = container.querySelector('.card');
    const addBtn = card.querySelector('.btn-secondary').parentElement;
    // Prevent multiple unsaved new-server forms at once (idx -1 → id "new")
    if (document.getElementById('opds-new')) return;
    addBtn.insertAdjacentHTML('beforebegin', renderOpdsServer({name:'',url:'',username:'',hasPassword:false}, -1));
  }

  async function saveOpdsServer(idx) {
    const id = idx === -1 ? 'new' : idx;
    const data = {
      name: document.getElementById('opds-name-' + id).value,
      url: document.getElementById('opds-url-' + id).value,
      username: document.getElementById('opds-user-' + id).value,
    };
    // Only include password in payload when the user actually typed something;
    // omitting it tells the server to keep the existing password.
    const pass = document.getElementById('opds-pass-' + id).value;
    if (pass) data.password = pass;
    if (idx >= 0) data.index = idx;

    try {
      const resp = await fetch('/api/opds', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage(tr('opdsSaved'), false);
      await loadOpdsServers();
    } catch (e) {
      showMessage(tr('errPrefix') + e.message, true);
    }
  }

  async function deleteOpdsServer(idx) {
    if (!confirm(tr('opdsDelConfirm'))) return;
    try {
      const resp = await fetch('/api/opds/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: idx})
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage(tr('opdsDeleted'), false);
      await loadOpdsServers();
    } catch (e) {
      showMessage(tr('errPrefix') + e.message, true);
    }
  }

  loadWifiNetworks();
  loadCloudConfig();
  loadOpdsServers();
</script>
</body>
</html>
