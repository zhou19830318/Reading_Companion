# Development profile: no domain yet, plain ws:// on port 8080
# (the only alternate port opened in the cloud security group).
# Production must use the TLS profile (nginx-voice-relay-prod.conf) instead.
# Install to /etc/nginx/sites-available/reading-companion-relay.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 2m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    # The device's only data path.
    location /api/v1/voice/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SSE debug endpoint (admin token protected; disabled when no admin token).
    location /api/v1/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    # Text-to-image cards: generation call + the BMP asset itself.
    location /api/v1/image {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /api/v1/device/config {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # /metrics stays internal (127.0.0.1:8000 only).
    location / {
        return 404;
    }
}
